name: Live preview (GitHub Pages)

# Publishes the same static export to GitHub Pages, so the site is reachable
# without any hosting credentials at all. Needs no secrets: the built-in
# GITHUB_TOKEN is enough, and configure-pages turns Pages on by itself the
# first time this runs.
#
# URL: https://sameerhameedbaba-stack.github.io/cyberxsolutions/
#
# This is a preview, not the production home. It is served from a /cyberxsolutions/
# subpath and is excluded from search engines, so it can never compete with
# cyberxsolutions.us for rankings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Switches the repository's Pages source to GitHub Actions if it is
          # not already, so nobody has to click through Settings first.
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static export under the project sub-path
        env:
          BASE_PATH: /cyberxsolutions
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: npm run build:static

      - name: Prepare the artifact
        run: |
          set -euo pipefail

          # Without this, Pages runs the output through Jekyll, which drops every
          # directory beginning with an underscore — including _next. The site
          # would load with no CSS or JavaScript at all.
          touch out/.nojekyll

          # A preview must never be indexed; cyberxsolutions.us is the canonical
          # home and duplicate content would hurt it.
          printf 'User-agent: *\nDisallow: /\n' > out/robots.txt

          # Apache config means nothing to Pages.
          rm -f out/.htaccess

          pages=$(find out -name index.html | wc -l)
          echo "Publishing $pages pages, $(du -sh out | cut -f1) total"
          [ "$pages" -ge 30 ] || { echo "::error::only $pages pages built"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
