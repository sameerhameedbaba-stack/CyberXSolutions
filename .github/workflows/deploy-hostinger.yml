name: Deploy to Hostinger

# Builds the static export and uploads it to Hostinger over FTPS.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   HOSTINGER_FTP_HOST      e.g. ftp.cyberxsolutions.us
#   HOSTINGER_FTP_USER      the FTP account username from hPanel
#   HOSTINGER_FTP_PASSWORD  that account's password
#
# Optional repository variables (same page, "Variables" tab):
#   CONTACT_ENDPOINT        external form handler URL; without it the contact
#                           form reports that it is not configured
#   FTP_SERVER_DIR          Remote path RELATIVE TO THE FTP ACCOUNT'S HOME.
#                           Hostinger's main FTP account is already rooted at
#                           public_html, so the default './' is correct there.
#                           Only set this if your FTP user lands somewhere else
#                           — pointing it at 'public_html/' when the account is
#                           already inside public_html deploys to
#                           public_html/public_html/ and the site appears dead.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # First, so a missing credential costs two seconds instead of a full
      # build. The FTP action reports only "Input required and not supplied:
      # password", which does not say which secret or that blank counts as
      # missing — hence checking here where we can name the problem.
      - name: Check the deploy credentials are present
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_HOST" ]     || missing="$missing HOSTINGER_FTP_HOST"
          [ -n "$FTP_USER" ]     || missing="$missing HOSTINGER_FTP_USER"
          [ -n "$FTP_PASSWORD" ] || missing="$missing HOSTINGER_FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions →"
            echo "Repository secrets. A secret saved with an empty value fails"
            echo "here exactly like one that was never added, so after saving,"
            echo "reload that page and confirm the row shows an 'Updated'"
            echo "timestamp of just now."
            exit 1
          fi
          echo "All three FTP secrets are present and non-empty."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build static export
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: npm run build:static

      - name: Verify the export looks sane
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/.htaccess || { echo "::error::out/.htaccess missing — Apache config would not ship"; exit 1; }
          test -f out/sitemap.xml || { echo "::error::sitemap missing"; exit 1; }
          pages=$(find out -name index.html | wc -l)
          echo "Exported $pages pages, $(du -sh out | cut -f1) total"
          [ "$pages" -ge 30 ] || { echo "::error::only $pages pages exported, expected 30+"; exit 1; }

      - name: Upload to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          # Explicit FTPS (AUTH TLS) over the standard control port.
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          # Keep anything Hostinger puts there itself.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/default.php
            **/cgi-bin/**
