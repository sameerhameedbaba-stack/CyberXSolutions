name: Deploy to GitHub Pages

# A deploy that needs nothing set up: no secrets, no settings.
#
# It builds the static export and force-pushes it to the gh-pages branch with
# the GITHUB_TOKEN every run gets for free. Publishing this way needs only
# contents: write, which a workflow can grant itself — unlike the Pages
# deployment API, which cannot create a Pages site with that token.
#
# Publishes to https://sameerhameedbaba-stack.github.io/CyberXSolutions/
#
# Pages serves the site from the /CyberXSolutions/ subdirectory, hence the
# base path. To move to cyberxsolutions.us later: point a DNS record at
# sameerhameedbaba-stack.github.io and drop BUILD_BASE_PATH so the site
# builds for a domain root instead.

on:
  push:
    branches: [main, claude/hostinger-ftp-password-secret-onfcmv]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Build static export
        env:
          BUILD_BASE_PATH: /CyberXSolutions
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}
        run: npm run build:static

      - name: Verify the export looks sane
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/sitemap.xml || { echo "::error::sitemap missing"; exit 1; }
          pages=$(find out -name index.html | wc -l)
          echo "Exported $pages pages, $(du -sh out | cut -f1) total"
          [ "$pages" -ge 30 ] || { echo "::error::only $pages pages exported, expected 30+"; exit 1; }
          grep -q '/CyberXSolutions/_next/' out/index.html \
            || { echo "::error::asset URLs are missing the base path — they would 404 on Pages"; exit 1; }

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Pages runs Jekyll unless told not to, and Jekyll drops directories
          # starting with an underscore — which would take out all of _next/.
          touch out/.nojekyll

          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA}"

          # The branch holds generated output only, so each deploy replaces it
          # wholesale rather than accumulating history.
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

          echo "Pushed $(find . -name index.html | wc -l) pages to gh-pages"
